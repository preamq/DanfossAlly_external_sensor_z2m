blueprint:
  name: "Danfoss Ally Thermostat External Temperature Sensor Integration"
  description: |
    # Danfoss Ally External Temperature Sensor Integration

    This blueprint automates the integration of an external temperature sensor with a Danfoss Ally thermostat via Zigbee2MQTT. It will not work with other integrations like Deconz or ZHA and will not work with any other thermostat brands.

    ## How it works
    - Converts temperature sensor values to the required format (multiplied by 100)
    - Updates the thermostat's external measured room sensor automatically
    - Triggers on sensor state changes with optimized refresh intervals
    - Manages periodic updates via a timer helper to reduce battery drain

    ## Setup Guide

    ### 1. Create Required Helpers
    Go to **Settings > Devices & Services > Helpers > Create Helper**

    #### Number Helper (Integer Helper)
    - **Name:** Temperature Scaling Helper
    - **Display mode:** Input
    - **Step:** 1
    - **Min value:** -8000
    - **Max value:** 3500
    - Stores the scaled temperature value for reference

    #### Timer Helper
    - **Name:** Temperature Update Timer
    - Used to periodically trigger temperature updates

    ### 2. Configure Inputs
    - Select your external temperature sensor (Celsius)
    - Select the number helper you created
    - Select the timer helper you created
    - Set timer duration (recommended: 10-30 minutes)
    - Select your Danfoss Ally thermostat device

    ## Notes
    - Temperature sensor must report in degrees Celsius
    - Timer duration balances responsiveness and battery life
    - The blueprint automatically finds the external measured room sensor entity

  domain: automation
  author: "preamq"
  
  input:
    temperature_sensor:
      name: Temperature sensor
      description: Select the temperature sensor entity that provides external temperature readings in degrees Celsius.
      selector:
        entity:
          domain: sensor
          device_class: temperature

    integer_helper:
      name: Integer helper (input_number)
      description: Select or create an input_number helper configured with Min = -8000, Max = 3500, Step = 1.
      selector:
        entity:
          domain: input_number

    timer_helper:
      name: Timer helper
      description: Select a timer helper entity for periodic temperature update triggers.
      selector:
        entity:
          domain: timer

    timer_duration:
      name: Timer duration
      description: Set the interval between automatic temperature updates (recommended 10-30 minutes).
      selector:
        duration:
          enable_day: false
          enable_millisecond: false

    thermostat_device:
      name: Danfoss Ally thermostat
      description: Select the Danfoss Ally thermostat device integrated via MQTT (Zigbee2MQTT).
      selector:
        device:
          integration: mqtt
          manufacturer: Danfoss

# Define variables used in the automation
variables:
  thermostat_device: !input thermostat_device
  external_measured_room_sensor: >
    # Find the external measured room sensor entity for the selected thermostat device
    {{ device_entities(thermostat_device) | select('match', '.*_external_measured_room_sensor$') | list | first | default('') }}

# Automation configuration
mode: queued
max: 10

# Triggers for the automation
trigger:
  - platform: state
    entity_id: !input temperature_sensor
    # Trigger when the temperature sensor changes state

  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_helper
    # Trigger when the timer helper finishes

# Conditions to check before running actions
condition:
  - condition: template
    value_template: >
      # Ensure the temperature sensor has a valid state (not unknown, unavailable, or none)
      {{ states('!input temperature_sensor') not in ['unknown','unavailable','none'] }}

# Actions to perform when triggered
action:
  - service: input_number.set_value
    target:
      entity_id: !input integer_helper
    data:
      value: "{{ (states('!input temperature_sensor') | float(0) * 100) | round(0) | int }}"
    # Set the integer helper to the scaled temperature value (multiplied by 100)

  - service: number.set_value
    target:
      entity_id: "{{ external_measured_room_sensor }}"
    data:
      value: "{{ (states('!input temperature_sensor') | float(0) * 100) | round(0) | int }}"
    # Update the thermostat's external measured room sensor with the scaled value

  - service: timer.start
    target:
      entity_id: !input timer_helper
    data:
      duration: !input timer_duration
    # Restart the timer for the next periodic update
